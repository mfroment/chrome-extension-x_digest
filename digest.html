<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Digest</title>
  <link rel="stylesheet" href="digest.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>X Digest</h1>
      <span class="sep" aria-hidden="true"></span>
      <select id="account" title="X account"></select>
      <span class="sep" aria-hidden="true"></span>
      <span class="stats" id="stats">—</span>
    </div>
    <div class="controls center-controls" id="timeline-controls">
      <span class="search-wrap">
        <input type="text" id="search" placeholder="Search — text, @author, likes:&gt;10…"
          title="text            match anywhere
&quot;quoted text&quot;    match the post body only
@handle          author, reposter, or a repost's original author
likes:&gt;10        also &gt;=, &lt;, &lt;=, =  (bare number means =)
replies:&gt;5   reposts:&gt;10
is:read  is:unread  is:liked  is:repost  is:reply
has:media  has:link
tier:full | summary | other | none   (none = not analyzed yet)
-term  NOT term    exclude
AND (optional)  OR  ( )

Example: (@alice OR @bob) likes:&gt;10 &quot;hello world&quot;" />
        <button id="search-clear" class="search-clear" type="button" hidden aria-label="Clear search" title="Clear search">×</button>
      </span>
      <button id="only-unread" class="btn filter-btn" aria-pressed="false" title="Show only unread posts">Unread only</button>
      <button id="only-analyzed" class="btn filter-btn" aria-pressed="false" title="Show only posts the analysis has processed (hides the not-yet-analyzed ones)">Analyzed only</button>
      <button id="sort-order" class="btn sort-btn" title="Toggle reading order">↓ Oldest first</button>
    </div>
    <div class="controls center-controls" id="events-controls" hidden>
      <input type="search" id="event-search" placeholder="Search events…" />
      <button id="event-unhidden-only" class="btn filter-btn" aria-pressed="true" title="Show only events you haven't hidden">Unhidden only</button>
      <button id="event-sort-order" class="btn sort-btn" title="Toggle event order">↓ Oldest first</button>
    </div>
    <div class="controls right-controls">
      <button id="undo" class="btn" hidden title="Undo the last mark action (Ctrl/⌘+Z)">↶ Undo</button>
      <div class="btn-group">
        <button id="sync" class="btn" title="Open x.com and auto-scroll the Following feed to fetch new posts, stopping when caught up">🔄 Sync</button>
        <button id="analyze" class="btn" title="Classify, summarize and extract events with Claude (right-click: re-analyze all)">✨ Analyze</button>
        <button id="refresh" class="btn" title="Reload from the database">Refresh</button>
      </div>
      <button id="open-settings" class="btn" title="Settings">⚙</button>
    </div>
    <div class="controls subbar">
      <div class="sub-left"></div>
      <nav class="tabs" role="tablist">
        <button id="tab-timeline" class="tab" role="tab">Timeline</button>
        <button id="tab-events" class="tab" role="tab">📅 Events</button>
      </nav>
      <span id="pipeline-status" class="stats" aria-live="polite"></span>
    </div>
  </header>

  <main class="list-wrap">
    <section id="events" class="events" hidden>
      <div id="events-list"></div>
      <p class="events-empty" id="events-empty" hidden>No upcoming events detected yet.
        Events appear here after ✨ Analyze finds announcements with a future date.</p>
    </section>

    <div id="list" class="list" aria-live="polite">
      <div class="empty" id="empty">
        <p><strong>No posts captured yet.</strong></p>
        <p>Open <a href="https://x.com/home" target="_blank" rel="noopener">x.com</a> on the
          "Following" tab and scroll the timeline: posts will appear here as you go.</p>
      </div>
    </div>
  </main>

  <script type="module" src="digest.js"></script>
</body>
</html>
